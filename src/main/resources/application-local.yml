spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:h2:mem:bankdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 5

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

logging:
  level:
    com.bank: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %-5level [%thread] %logger{36} - %msg%n"

app:
  jwt:
    secret: bXlTZWNyZXRLZXlGb3JKV1QzMkNoYXJzTG9uZ1Rlc3Rpbmc=
  encryption:
    key: bXlFbmNyeXB0aW9uS2V5MzJDaGFyc0xvbmcyMDI1

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.xml
