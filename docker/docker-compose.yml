version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: bank-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bankdb}
      POSTGRES_USER: ${POSTGRES_USER:-bankuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bankpass123!}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bank-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bankuser}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bank-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bankdb}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-bankuser}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-bankpass123!}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-dGVzdC1qd3Qtc2VjcmV0LTMyaGFycy1sb25nLWZvci10ZXN0aW5nMTIzNDU2}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-dGVzdC1lbmNyeXB0aW9uLWtleS0zMmhhcnMtbG9uZy1mb3ItdGVzdGluZzEyMzQ1Ng==}
      APP_RATE_LIMIT_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bank-network
    restart: unless-stopped

networks:
  bank-network:
    driver: bridge

volumes:
  postgres_data:
