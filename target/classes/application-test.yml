spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ''

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        show_sql: false
        format_sql: false
    generate-ddl: true

  liquibase:
    enabled: false
    change-log: classpath:/db/changelog/db.changelog-master.xml

  cache:
    type: none

logging:
  level:
    root: WARN
    com.bank: INFO
    org.hibernate.SQL: WARN

app:
  jwt:
    secret: test-jwt-secret-for-testing-32-chars-minimum
  encryption:
    key: test-encryption-key-for-testing-32-chars-min
  rate-limit:
    enabled: false
